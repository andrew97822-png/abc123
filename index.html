<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12345678 身心靈能量檢測</title>
    <!-- 引入 Chart.js 用於繪製雷達圖 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 marked.js 解析 AI 的 Markdown 格式 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>   
    <style>
        :root {
            --primary-color: #2e7d32;
            --bg-color: #f4f6f0;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .question-group {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }

        .question-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-label:hover {
            background-color: #f0f7f0;
        }

        .option-label input {
            margin-right: 10px;
        }

        .form-section {
            margin-top: 30px;
            background-color: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eaeaea;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input {
            width: 95%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        button.btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        button.btn-submit:hover {
            opacity: 0.9;
        }

        /* 結果顯示區域 */
        #result-section {
            display: none;
            margin-top: 30px;
        }

        .chart-container {
            position: relative;
            margin: auto;
            height: 320px;
            width: 320px;
        }

        .ai-comment-box {
            margin-top: 24px;
            background: #eef7ee;
            padding: 16px 20px;
            border-left: 4px solid var(--primary-color);
            border-radius: 6px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>test</h1>
    <div class="subtitle">身心靈能量檢測 — 探索你的五維內在狀態</div>

    <form id="quiz-form">
        <!-- 題目動態渲染區域 -->
        <div id="questions-container"></div>

        <!-- 留下個人資料 -->
        <div class="form-section">
            <h3>📬 接收完整 AI 深度分析</h3>
            <div class="form-group">
                <label for="userName">您的稱呼</label>
                <input type="text" id="userName" placeholder="例如：張小明" required>
            </div>
            <div class="form-group">
                <label for="userEmail">您的 Email 信箱</label>
                <input type="email" id="userEmail" placeholder="name@example.com" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">✨ 生成分析報告與雷達圖</button>
    </form>

    <!-- 結果展現區域 -->
    <div id="result-section">
        <h2 style="text-align: center; color: var(--primary-color);">您的身心靈五維能量圖</h2>
        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>
        <div class="ai-comment-box" id="aiComment">
            ⌛ AI 導師正在為您進行五維度深度分析與報告寄送，請稍候...
        </div>
    </div>
</div>

<script>
    // 10 題情境題目設定（每個維度 2 題，選項分數 1~5 分）
    const questions = [
        { id: "q1", category: "sleep", text: "1. 早上起床時，你通常感到精力充沛還是依舊疲憊？", options: [{ text: "非常疲憊", score: 1 }, { text: "有點疲憊", score: 2 }, { text: "普通", score: 3 }, { text: "挺有精神", score: 4 }, { text: "神清氣爽", score: 5 }] },
        { id: "q2", category: "sleep", text: "2. 近期的入睡順暢度或睡眠品質如何？", options: [{ text: "經常失眠/多夢", score: 1 }, { text: "偶爾入睡困難", score: 2 }, { text: "普通", score: 3 }, { text: "品質尚可", score: 4 }, { text: "一覺到天亮", score: 5 }] },
        
        { id: "q3", category: "stress", text: "3. 當面對突發的繁重工作或生活變故時，你的反應通常是？", options: [{ text: "極度焦慮慌亂", score: 1 }, { text: "感到吃力與壓力", score: 2 }, { text: "需要時間適應", score: 3 }, { text: "能冷靜應對", score: 4 }, { text: "游刃有餘", score: 5 }] },
        { id: "q4", category: "stress", text: "4. 你能在高壓的一天結束後迅速放鬆下來嗎？", options: [{ text: "完全無法放鬆", score: 1 }, { text: "需要很長過程", score: 2 }, { text: "偶爾可以", score: 3 }, { text: "多數時候能抽離", score: 4 }, { text: "切換自如", score: 5 }] },

        { id: "q5", category: "emotion", text: "5. 面對低落或憤怒的情緒時，你通常如何處理？", options: [{ text: "壓抑或被情緒淹沒", score: 1 }, { text: "容易受情緒影響很久", score: 2 }, { text: "需要點時間消化", score: 3 }, { text: "能察覺並進行自我安撫", score: 4 }, { text: "接納並快速調適", score: 5 }] },
        { id: "q6", category: "emotion", text: "6. 你是否容易感知到他人情緒並受其干擾？", options: [{ text: "極易受嚴重影響", score: 1 }, { text: "經常被他人情緒牽著走", score: 2 }, { text: "偶爾會受影響", score: 3 }, { text: "有良好情緒界線", score: 4 }, { text: "完全能保有獨立內在", score: 5 }] },

        { id: "q7", category: "mind", text: "7. 在處理複雜事務時，你的專注力與思考清晰度如何？", options: [{ text: "腦袋一片混沌/難專注", score: 1 }, { text: "容易分心", score: 2 }, { text: "普通", score: 3 }, { text: "思路清晰", score: 4 }, { text: "高度專注且敏捷", score: 5 }] },
        { id: "q8", category: "mind", text: "8. 你是否經常因為過度思考（Overthinking）而感到心智耗竭？", options: [{ text: "總是如此，很累", score: 1 }, { text: "經常如此", score: 2 }, { text: "偶爾會", score: 3 }, { text: "很少發生", score: 4 }, { text: "從不，心智很平靜", score: 5 }] },

        { id: "q9", category: "inner", text: "9. 你平時有多常進行冥想、獨處或與自己內心對話？", options: [{ text: "從不", score: 1 }, { text: "極少", score: 2 }, { text: "偶爾為之", score: 3 }, { text: "有規律習慣", score: 4 }, { text: "這是每天必備部分", score: 5 }] },
        { id: "q10", category: "inner", text: "10. 你是否能感受到與大自然或內在生命力的深刻連結？", options: [{ text: "完全感受不到", score: 1 }, { text: "感受微弱", score: 2 }, { text: "普通", score: 3 }, { text: "能明確感受到", score: 4 }, { text: "充滿深刻連結與平靜", score: 5 }] }
    ];

    let radarChartInstance = null;

    // 確保頁面 HTML 元件完整載入後才渲染題目與繫結事件
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById("questions-container");
        if (container) {
            questions.forEach((q) => {
                const qDiv = document.createElement("div");
                qDiv.className = "question-group";
                
                let optionsHtml = q.options.map(opt => `
                    <label class="option-label">
                        <input type="radio" name="${q.id}" value="${opt.score}" required>
                        ${opt.text}
                    </label>
                `).join('');

                qDiv.innerHTML = `
                    <div class="question-title">${q.text}</div>
                    <div class="options-group">${optionsHtml}</div>
                `;
                container.appendChild(qDiv);
            });
        }

        // 表單提交事件處理
        document.getElementById("quiz-form").addEventListener("submit", function(e) {
            e.preventDefault();

            // 1. 算分 (五維度分數)
            const scores = { sleep: 0, stress: 0, emotion: 0, mind: 0, inner: 0 };
            questions.forEach(q => {
                const selected = document.querySelector(`input[name="${q.id}"]:checked`);
                if (selected) {
                    scores[q.category] += parseInt(selected.value);
                }
            });

            const finalScores = [
                scores.sleep,
                scores.stress,
                scores.emotion,
                scores.mind,
                scores.inner
            ];

            const name = document.getElementById("userName").value;
            const email = document.getElementById("userEmail").value;

            // 2. 顯示結果區塊並繪畫雷達圖
            document.getElementById("result-section").style.display = "block";
            renderRadarChart(finalScores);

            // 3. 呼叫 Python 後端 API (https://abc123-1jyf.onrender.com/api/analyze)
            document.getElementById("aiComment").innerHTML = "⌛ AI 導師正在為您進行五維度深度分析與報告寄送，請稍候...";

            fetch("https://abc123-1jyf.onrender.com/api/analyze", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    scores: {
                        sleep: scores.sleep,
                        stress: scores.stress,
                        emotion: scores.emotion,
                        mind: scores.mind,
                        inner: scores.inner
                    }
                })
            })
            .then(res => res.json())
            .then(data => {
                console.log("【DEBUG 前端收到資料】", data);
                
                if (data.status === "success") {
                    document.getElementById("aiComment").innerHTML = `
                        💡 <strong>${name} 您的專屬身心靈深度分析：</strong><br><br>
                         ${marked.parse(data.ai_comment)}
                    `;
                } else {
                    document.getElementById("aiComment").innerHTML = "分析過程發生錯誤，請稍後再試。";
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById("aiComment").innerHTML = "無法連接到 AI 後端伺服器，請確認後端 (main.py) 是否已啟動。";
            });

            // 平滑滾動至結果區域
            document.getElementById("result-section").scrollIntoView({ behavior: 'smooth' });
        });
    });

    // 雷達圖繪製函式
    function renderRadarChart(dataScores) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        
        if (radarChartInstance) {
            radarChartInstance.destroy();
        }

        radarChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['睡眠修復', '壓力抗性', '情緒覺察', '心智清晰', '內在連結'],
                datasets: [{
                    label: '身心靈指數',
                    data: dataScores,
                    backgroundColor: 'rgba(46, 125, 50, 0.2)',
                    borderColor: '#2e7d32',
                    pointBackgroundColor: '#2e7d32',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: '#2e7d32'
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { display: true },
                        suggestedMin: 0,
                        suggestedMax: 10,
                        ticks: { stepSize: 2 }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }
</script>

</body> 
</html>
